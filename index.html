const ans={},wq={};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function nav(canNext,last){return `<div class="nav"><div><button class="btn" onclick="go(-1)" ${i===0?'disabled':''}>上一步</button><button class="btn primary" onclick="go(1)" ${canNext?'':'disabled'}>${last||'下一步'}</button></div></div>`}
function go(d){i=Math.max(0,Math.min(steps.length-1,i+d));render()}
function pick(qid,idx,multi){
  if(multi){const a=ans[qid]=ans[qid]||[];const p=a.indexOf(idx);if(p>=0)a.splice(p,1);else if(a.length<multi)a.push(idx)}
  else ans[qid]=idx;
  render();
}
function progress(){return `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${steps.length-2}" aria-valuenow="${i}"><i style="width:${i/(steps.length-2)*100}%"></i></div>`}

function render(){
  const s=steps[i];let h='';
  if(s.k==='county'){
    h=`<h1>找適合你的候選人</h1><p class="note">回答約 12 題,看看你所在縣市的縣市長候選人與你有多契合。<b>你的答案不會離開這台裝置。</b></p>
    <div class="card"><label for="c"><b>你的縣市</b></label><p class="note">預設為你在地圖上最後點選的縣市。</p>
    <select id="c" onchange="county=this.value">${COUNTIES.map(c=>`<option ${c===county?'selected':''}>${c}</option>`).join('')}</select></div>
    <p class="note">契合度只反映你和候選人在這幾題上的相近程度,不代表好壞。</p>`+nav(true,'開始');
  }else if(s.k==='q'){
    const q=s.q;const a=ans[q.id];
    h=progress()+`<div class="facet">${FACETS[q.f]}</div><h2>${esc(q.t)}</h2>${q.n?`<p class="note">${esc(q.n)}</p>`:''}`+
    `<div role="${q.multi?'group':'radiogroup'}" aria-label="${esc(q.t)}">`+q.o.map((o,k)=>{
      const on=q.multi?(a||[]).includes(k):a===k;
      return `<button class="opt" role="${q.multi?'checkbox':'radio'}" aria-checked="${on}" onclick="pick('${q.id}',${k},${q.multi||0})">${esc(o[0])}${o[1]?`<small>${esc(o[1])}</small>`:''}</button>`}).join('')+`</div>`+
    ((a!=null&&!q.multi&&!q.optw&&!q.o[a][2])?`<div class="imp"><b>這題對你的決定有多重要?</b><div class="impbtns" role="radiogroup" aria-label="重要程度">${['不重要','普通','很重要'].map((l,k)=>`<button class="chip" role="radio" aria-checked="${(wq[q.id]??1)===k}" onclick="wq['${q.id}']=${k};render()">${l}</button>`).join('')}</div></div>`:'')+
    `<p class="note">不確定?直接按「下一步」即可跳過這題。</p>`+nav(true);
  }else{ h=result() }
  app.innerHTML=h;window.scrollTo(0,0);
}

/* 相關事蹟裡顯示使用者在該題的作答 */
function ansOf(q){
  if(q.id==='priority')return '・你的作答:有勾選此領域';
  const a=ans[q.id],full=Q.find(x=>x.id===q.id);
  if(a==null||!full||!full.o[a])return '';
  const imp=(!full.optw&&!full.o[a][2])?`(重要程度:${['不重要','普通','很重要'][wq[q.id]??1]})`:'';
  return `・你的作答:「${esc(full.o[a][0])}」${imp}`;
}
/* ===== 計分:正向 100%、負向 0%、查無資訊 33.3%;政黨推定權重 0.5 ===== */
const UNKNOWN=1/3;
const LEG_CAP=0.8; /* 民意代表(立委、議員)做過的事:正向最高 80%,負向不變 */
function facetFit(c,fi){
  let num=0,den=0,rows=[],nq=0,unk=0,calc=[];
  Q.filter(q=>q.f===fi&&!q.multi).forEach(q=>{
    const a=ans[q.id];if(a==null||(q.o[a][2]))return;
    const m=q.optw?q.optw[a]:[0,1,2][wq[q.id]??1];if(m===0)return;
    let v=UNKNOWN,w=1,hit=null;
    if(q.id==='party'){v=c.party===a?1:0;hit={party:1,v,t:`所屬政黨:${c.p}`}}
    else{
      /* 證據分三層,取最高的一層:① 做過的事(政績、事蹟):正向 100%、負向 0%
         ② 政見:最早提出 66.6%、其他也提出 50% ③ 政黨推定(權重 0.5);都沒有 → 查無資訊 */
      const hits=c.ev.filter(e=>e.q===q.id&&a in e.map);
      const deeds=hits.filter(e=>e.kind!=='platform'&&e.kind!=='party');
      const plats=hits.filter(e=>e.kind==='platform');
      if(deeds.length){v=deeds.reduce((x,e)=>x+(e.by==='leg'?Math.min(e.map[a],LEG_CAP):e.map[a]),0)/deeds.length;hit={...deeds[0],v,tier:'deed'}}
      else if(plats.length){const best=plats.reduce((x,e)=>(e.rank===1?1:0)>=(x.rank===1?1:0)?e:x);v=best.map[a]*(best.rank===1?2/3:.5);hit={...best,v,tier:'platform'}}
      else{const pe=(PARTY_EV[c.pid]||{})[q.id];if(pe&&a in pe.map){v=pe.map[a];w=.5;hit={v,party:1,facts:pe.facts,tier:'party'}}}
    }
    const ew=w;w*=m;num+=v*w;den+=w;nq++;
    calc.push({q,v,ew,m,w,tier:q.id==='party'?'政黨比對':hit?(hit.tier==='deed'?'做過的事':hit.tier==='platform'?(hit.rank===1?'政見(最早提出)':'政見(其他也提出)'):'政黨推定'):'查無資訊'});
    if(hit)rows.push({q,hit});else unk++;
  });
  if(fi===3&&(ans.priority||[]).length){
    /* 施政優先序:選到的領域,以候選人在該領域「做過的事」計(正向 100%、負向 0%,多筆取平均);沒有紀錄 → 查無資訊 */
    const pq=Q.find(q=>q.id==='priority');
    ans.priority.forEach(k=>{
      const dom=pq.o[k][0],ex=c.ev.filter(e=>e.q==='priority'&&e.dom===dom);
      /* 沒有專為優先序建立的資料時,改用該領域已有的政見與政績(站長判定的事蹟不算;只取有正向選項者) */
      const evs=ex.length?ex:c.ev.filter(e=>['urban','vulnerable','childcare','heritage','econ','pace'].includes(e.q)&&e.dom===dom&&e.src!=='站長判定'&&Object.values(e.map||{}).some(x=>x>0)).map(e=>({...e,v:1}));
      const dd=evs.filter(e=>e.kind!=='platform'),pp=evs.filter(e=>e.kind==='platform');
      /* 做過的事優先;其次政見(最早提出 66.7%、其他 50%);都沒有 → 查無資訊 */
      const v=dd.length?dd.reduce((x,e)=>x+(e.by==='leg'?Math.min(e.v,LEG_CAP):e.v),0)/dd.length:pp.length?Math.max(...pp.map(e=>e.v*(e.rank===1?2/3:.5))):UNKNOWN;
      num+=v;den+=1;nq++;
      calc.push({q:{id:'priority',t:'施政優先序:'+dom},v,ew:1,m:1,w:1,tier:dd.length?'做過的事':pp.length?'政見':'查無資訊'});
      if(evs.length)rows.push({q:{id:'priority',t:'施政優先序:'+dom},hit:{...(dd[0]||pp[0]),v,tier:dd.length?'deed':'platform'}});else unk++;
    });
  }
  return {fit:den?num/den:null,num,den,rows,nq,unk,calc};
}
function cells(n){return [0,1,2,3,4].map(k=>`<span class="cell ${k<n?'on':''}" aria-hidden="true"></span>`).join('')}
function band(x){return x==null?['資料不足',0]:x>=.8?['高度契合',5]:x>=.6?['較為契合',4]:x>=.4?['部分契合',3]:x>=.2?['較不契合',2]:['低度契合',1]}
function result(){
  const rows=cands().map(c=>{
    let tn=0,td=0;const fs=FACETS.map((f,fi)=>{const r=facetFit(c,fi);tn+=r.num;td+=r.den;return {f,r,w:1}});
    const nq=fs.reduce((x,y)=>x+(y.w>0?y.r.nq:0),0),unk=fs.reduce((x,y)=>x+(y.w>0?y.r.unk:0),0);
    return {c,fs,total:td?tn/td:null,sparse:fs.every(x=>x.r.rows.every(r=>['party','edu','integrity','incumb'].includes(r.q.id)))}
  }).sort((a,b)=>(b.total??-1)-(a.total??-1));
  const mapLink=`${MAP_BASE}?county=${encodeURIComponent(county)}`;
  return `<div class="row"><h1>${esc(county)} 縣市長候選人</h1><a class="toplink" href="${mapLink}" target="_blank" rel="noopener">完整紀事 ↗</a></div>
  <p class="note">契合度只反映你和候選人在這幾題上的相近程度,不代表好壞。</p>`+
  rows.map(({c,fs,total,sparse})=>{
    const pct=total==null?null:Math.round(total*100);
    const calc=fs.flatMap(x=>x.r.calc);const sn=calc.reduce((x,y)=>x+y.v*y.w,0),sd=calc.reduce((x,y)=>x+y.w,0);
    const shown=fs.map(x=>({f:x.f,rows:x.r.rows})).filter(x=>x.rows.length);
    return `<section class="card"><div class="row"><span><b>${c.n}</b> <span class="tag">${c.p}</span></span></div>
    <div class="row" style="margin-top:8px"><span class="pct">${pct==null?'—':pct+'%'}</span><span class="meter" aria-hidden="true"><i style="width:${pct||0}%"></i></span></div>
    ${sparse?'<p class="note" style="margin:6px 0 0">多數題目查無資訊(以 33.3% 計)</p>':''}
    ${shown.length?`<details><summary>相關事蹟</summary>${shown.map(x=>`<p style="margin-bottom:4px"><b>${x.f}</b></p>`+x.rows.map(({q,hit})=>hit.facts?`<div class="ev"><span class="tag party">依政黨推定:${c.p}</span> <span class="tag">${hit.v>=.5?'正向':hit.v>0?'部分':'負向'}</span>${hit.facts.map(f=>`<div style="margin-top:6px"><span class="tag">${f.tag==='ref'?'對照事實':f.tag==='neg'?'負向':'正向'}</span>${f.dom?` <span class="tag">${f.dom}</span>`:''} ${esc(f.t)}<div class="note">${f.d}・來源:${f.src}</div></div>`).join('')}<div class="note" style="margin-top:6px">對應題目:${esc(q.t.replace(/[?？]$/,''))}${ansOf(q)}</div></div>`:`<div class="ev"><span class="tag">${hit.v>=.5?'正向':hit.v>0?'部分':'負向'}</span> ${hit.cat?`<span class="tag">${hit.cat}</span>${hit.dom&&hit.dom!=='個人'?` <span class="tag">${hit.dom}</span>`:''}`:''}${hit.tier==='platform'?`<span class="tag">政見・${hit.rank===1?'第一個提出 66.6%':'其他也提出 50%'}</span>`:hit.tier==='deed'?`<span class="tag">做過的事・${+(hit.v*100).toFixed(1)}%</span>`:''}<div>${esc(hit.t)}</div><div class="note">${hit.d?hit.d+'・':''}${hit.src?'來源:'+hit.src+'・':''}對應題目:${esc(q.t.replace(/[?？]$/,''))}${ansOf(q)}</div></div>`).join('')).join('')}<p style="margin:14px 0 4px"><b>分數怎麼算</b></p><div class="tblw"><table class="calc"><thead><tr><th>題目</th><th>依據層級</th><th>分數</th><th>權重</th><th>分數×權重</th></tr></thead><tbody>${calc.map(r=>`<tr><td>${esc(r.q.t.replace(/[?？]$/,''))}</td><td>${r.tier}</td><td>${(r.v*100).toFixed(1)}%</td><td>${r.ew===1&&r.m===1?'1':`${r.ew}×${r.m}=${+r.w.toFixed(2)}`}</td><td>${(r.v*r.w).toFixed(2)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">合計</td><td>${+sd.toFixed(2)}</td><td>${sn.toFixed(2)}</td></tr><tr><td colspan="5">契合度 = ${sn.toFixed(2)} ÷ ${+sd.toFixed(2)} = <b>${sd?(sn/sd*100).toFixed(1):'—'}%</b></td></tr></tfoot></table></div><p class="note">權重 = 證據權重 × 你標的重要程度(不重要 0、普通 1、很重要 2);政黨推定的證據權重為 0.5,其餘為 1。</p></details>`:''}</section>`}).join('')+
  `<div class="warn"><b>提醒</b><p class="note">以下紀錄<b>不影響契合度</b>(有罪確定的判決僅在你把「操守」標為重要時才計入),請自行判斷。</p>
  ${cands().map(c=>{const d=remOf(c);return `<p><b>${c.n}</b>:${d.length?d.map(e=>esc(e.t)+'('+e.d+')').join(';'):'無需提醒的紀錄'}</p>`}).join('')}</div>
  <button class="btn" style="width:100%" onclick="i=0;for(const k in ans)delete ans[k];render()">重新作答</button>`;
}
render();
</script>
</body>
</html>
